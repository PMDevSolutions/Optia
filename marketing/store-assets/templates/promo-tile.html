<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Optia promo tile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(130% 160% at 10% 0%, #4f46e5 0%, #3730a3 60%, #1e1b4b 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 34px;
  }
  .wordmark { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
  .wordmark::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #a5b4fc; margin-left: 4px; }
  .tagline { margin-top: 12px; font-size: 17px; line-height: 1.35; color: rgba(255,255,255,0.85); max-width: 330px; }
  .score {
    position: absolute; right: 26px; bottom: 24px;
    width: 84px; height: 84px; border-radius: 50%;
    background: conic-gradient(#34d399 0 86%, rgba(255,255,255,0.18) 86% 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .score-inner {
    width: 64px; height: 64px; border-radius: 50%; background: #1e1b4b;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="wordmark">Optia</div>
  <p class="tagline" id="tagline">SEO score + AI recommendations for any page, right in your side panel.</p>
  <div class="score"><div class="score-inner" id="score">86</div></div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("tagline")) document.getElementById("tagline").textContent = q.get("tagline");
    if (q.get("score")) document.getElementById("score").textContent = q.get("score");
  </script>
</body>
</html>
