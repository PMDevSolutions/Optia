name: Release Zip (manual fallback)

# Rebuilds the Chrome Web Store upload package at a given tag and re-attaches
# it to that GitHub Release. The normal path is the attach-zip job inside
# release-please.yml — use this only to repair or regenerate a release asset.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  package:
    name: Build & attach store zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Zip dist and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          cd dist
          zip -r "../optia-${VERSION}.zip" .
          cd ..
          unzip -l "optia-${VERSION}.zip" | head -10
          gh release upload "${{ inputs.tag }}" "optia-${VERSION}.zip" --clobber
