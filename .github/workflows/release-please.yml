name: Release Please

# Maintains a Release PR from Conventional Commits on main. Merging that PR is
# the human release gate: it stamps the version into package.json,
# app/package.json, and app/manifest.json (see release-please-config.json
# extra-files), updates CHANGELOG.md, tags vX.Y.Z, and publishes a GitHub
# Release — which triggers release-zip.yml to attach the store package.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
