name: Release Please

# Maintains a Release PR from Conventional Commits on main. Merging that PR is
# the human release gate: it stamps the version into package.json,
# app/package.json, and app/manifest.json (see release-please-config.json
# extra-files), updates CHANGELOG.md, tags vX.Y.Z, and publishes a GitHub
# Release.
#
# The store zip is built and attached HERE, in the same run, because releases
# created with the default GITHUB_TOKEN do not trigger `on: release` workflows
# (this bit v0.2.0 — its zip had to be attached manually). release-zip.yml
# remains as a manual re-run fallback.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-zip:
    name: Build & attach store zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Zip dist and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          cd dist
          # The Chrome Web Store rejects manifests containing "key" ("key field
          # is not allowed in manifest") — it is a local-dev ID pin only. Strip
          # it from the store artifact; the repo manifest keeps it for dev.
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));delete m.key;fs.writeFileSync('manifest.json',JSON.stringify(m,null,2))"
          zip -r "../optia-${VERSION}.zip" .
          cd ..
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "optia-${VERSION}.zip" --clobber
